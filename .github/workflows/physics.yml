name: Physics checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m tools.build_acceptance
