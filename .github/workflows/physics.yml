name: Physics checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m tools.build_acceptance
      - run: python -m tools.verify_phase_b
      - run: python -m tools.audit_cloth
      - run: python -m tools.audit_draw_angles
      - run: python -m tools.audit_aim
      - run: python -m tools.verify_phase_c
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/lab.js
      - run: node --check web/table-modes.js
      - run: node --test tests/shot-guide.test.cjs
      - run: node tools/audit_aim.cjs
